# Dependabot —— 依赖自动升级
#
# 这个仓库的依赖分两类，风险不一样：
#
#   · **构建期**（electron / electron-builder / vite / vitest / typescript）——
#     只影响开发机和 CI，不进产物。升级要跑一遍打包（`npm run dist`）才知道
#     打包还成不成立 ⇒ 单独一个 group，攒一批再升。
#   · **运行期**（blockly / codemirror / react）—— **进产物**。这些是 IDE 的
#     脸面（块视图、文本视图），升级必须过一致性门 + 手动看一眼界面。
#     ⇒ 不自动升，交给人判断（见下面的 ignore）。
#
# ⚠️ **只自动升 patch / minor。大版本一律不开 PR。**
#
# 踩过的坑：group 里的 `update-types: [minor, patch]` **只决定「哪些更新并进这个组」**，
# **不是**「大版本不许升」—— 大版本照样会单独开 PR。配置一落地就开了 5 个：
# vite 8 / typescript 7 / electron-vite 6 / vitest 5 / @types/node 26，
# 里头两个直接是红的。⇒ 真要挡住大版本，得用下面 ignore 里的
# `version-update:semver-major`。
#
# 为什么挡住：大版本要改代码（Blockly 13 → 14、Electron 45 → 46 那种），
# 该由**人**决定什么时候接、怎么接 —— 自动开一堆红 PR 只是噪音。
# 真要升的时候手动改 package.json 就行，小版本会一直自动跟着。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # 构建期依赖：一起升，一起验
      build-toolchain:
        patterns:
          - electron
          - electron-builder
          - electron-vite
          - vite
          - vitest
          - typescript
          - "@types/*"
        update-types:
          - minor
          - patch
    ignore:
      # 大版本 —— 全都不自动开 PR（理由见上面的注释）
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # 运行期依赖 —— 进产物，升级要人判断（见上面的注释）
      - dependency-name: blockly
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: "@codemirror/*"
