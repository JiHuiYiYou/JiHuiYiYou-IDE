appId: com.jihuiyiyou.ide
productName: JHYY IDE
copyright: JHYY

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true

win:
  # 延用编译器仓库的品牌图标（`assets/` 下那套就是从那儿拷来的）——
  # electron-builder 要 256x256 起步，`.ico` 里带了 16/32/48/64/128/256 六档。
  icon: assets/jhyy-icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JHYY IDE
  deleteAppDataOnUninstall: false

# 打包体积大头是 Electron 本身（约 200 MB），压缩一下。
compression: normal
